services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ragguage
      POSTGRES_PASSWORD: ${RAGGAUGE_POSTGRES_PASSWORD:?Set a local database password}
      POSTGRES_DB: ragguage
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ragguage-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
volumes:
  ragguage-data:
