[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ragguage"
version = "0.1.0"
description = "Evidence-first RAG evaluation and deterministic regression diagnosis"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "argon2-cffi>=23",
  "httpx>=0.27,<1", "numpy>=2,<3",
  "jinja2>=3.1,<4",
  "alembic>=1.14,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.9"]
lab = ["pgvector>=0.3", "bm25s>=0.2", "sentence-transformers>=3", "ragas==0.4.3", "ir-measures>=0.3", "openai>=1,<3", "langchain-community>=0.3,<0.4", "langchain-openai>=0.3,<1", "langchain>=0.3,<1", "langchain-core>=0.3,<1"]

[project.scripts]
ragguage = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I", "F401", "UP035"]
